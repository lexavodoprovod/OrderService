spring:
  application:
    name: order-service
  liquibase:
    enabled: true
  datasource:
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  kafka:
    consumer:
      auto-offset-reset: earliest
topic-name:
  status: status-topic


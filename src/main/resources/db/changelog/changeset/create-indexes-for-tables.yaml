databaseChangeLog:
  - changeSet:
      id: create-indexes-for-tables
      author: Nikita
      changes:
        - createIndex:
            indexName: idx_user_id
            tableName: orders
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_order_id
            tableName: order_items
            columns:
              - column:
                  name: order_id

        - createIndex:
            indexName: idx_item_id
            tableName: order_items
            columns:
              - column:
                  name: item_id

        - createIndex:
            indexName: idx_item_name
            tableName: items
            columns:
              - column:
                  name: name